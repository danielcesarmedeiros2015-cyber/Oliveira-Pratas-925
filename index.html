<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Pratas 925</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO / NAVBAR MODERNA -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="brand-logo">
                <span class="brand-name">OLIVEIRA PRATAS 925</span>
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="#" onclick="filterProducts('TODOS')">Início</a>
                <a href="#" onclick="filterProducts('CORRENTES')">Correntes</a>
                <a href="#" onclick="filterProducts('PULSEIRAS')">Pulseiras</a>
                <a href="#" onclick="filterProducts('BRACELETES')">Braceletes</a>
                <a href="#" onclick="filterProducts('PIERCINGS')">Piercings</a>
            </nav>
            <div class="nav-actions">
                <button class="action-btn" onclick="openCartModal()">
                    🛒 <span class="badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <!-- HERO SECTION -->
        <section class="hero-section">
            <div class="container">
                <h1 class="hero-title">Oliveira Pratas 925</h1>
                <p class="hero-subtitle">Elegância e Autenticidade em Prata 925 legítima.</p>
            </div>
        </section>

        <!-- CATÁLOGO DE PRODUTOS -->
        <section class="container section-padding">
            <h2 class="section-title">
                <span>Catálogo</span>
                Nossos Produtos
            </h2>
            
            <div id="product-grid" class="products-grid">
                <!-- Os produtos serão injetados dinamicamente via script.js -->
            </div>
        </section>
    </main>

    <!-- MODAL DO CARRINHO SIMPLES -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCartModal()">&times;</button>
            <h2>Seu Carrinho</h2>
            <div id="cart-items-container" style="margin: 20px 0; max-height: 250px; overflow-y: auto;">
                <!-- Itens do carrinho -->
            </div>
            <div class="cart-summary">
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="cart-total-price">R$ 0,00</span>
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="checkoutWhatsApp()">Finalizar Pedido no WhatsApp</button>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 Oliveira Pratas 925. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Script Principal -->
    <script src="script.js"></script>
</body>
</html>
